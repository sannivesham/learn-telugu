<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>అనువాదం - సన్నివేశం</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .translator-page {
      min-height: 100vh;
      padding: 100px 20px 80px;
      max-width: 800px;
      margin: 0 auto;
    }

    .translator-title-box {
      text-align: center;
      margin-bottom: 36px;
    }

    .translator-title-box h1 {
      color: #ffd166;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .translator-title-box p {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
    }

    .lang-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .lang-label {
      color: #ffd166;
      font-size: 1rem;
      font-weight: bold;
      min-width: 80px;
      text-align: center;
    }

    .swap-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,209,102,0.4);
      background: rgba(255,209,102,0.1);
      color: #ffd166;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .swap-btn:hover {
      background: rgba(255,209,102,0.2);
      transform: rotate(180deg);
    }

    .translator-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .translator-panel {
      background: rgba(20,12,5,0.75);
      border: 1px solid rgba(255,209,102,0.3);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    .translator-panel-header {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,209,102,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .translator-panel-header span {
      color: rgba(255,209,102,0.8);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .clear-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      cursor: pointer;
    }
    .clear-btn:hover { color: rgba(255,255,255,0.8); }

    .translator-textarea {
      width: 100%;
      min-height: 200px;
      padding: 18px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 1rem;
      line-height: 1.7;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }

    .translator-textarea::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .output-text {
      padding: 18px;
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      line-height: 1.7;
      min-height: 200px;
      white-space: pre-wrap;
    }

    .output-placeholder {
      color: rgba(255,255,255,0.2);
      font-style: italic;
    }

    .translate-action-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .translate-btn-main {
      padding: 14px 40px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #C9A24B, #8a6a26);
      color: #1a1206;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .translate-btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201,162,75,0.3); }
    .translate-btn-main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .copy-btn {
      padding: 14px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,209,102,0.4);
      background: rgba(255,209,102,0.08);
      color: #ffd166;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .copy-btn:hover { background: rgba(255,209,102,0.16); }

    .char-count {
      text-align: right;
      padding: 6px 18px 10px;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
    }

    .loading-dots {
      display: none;
      gap: 6px;
      justify-content: center;
      padding: 18px;
    }
    .loading-dots.show { display: flex; }
    .loading-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ffd166;
      animation: dotBounce 1s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .quick-phrases {
      margin-top: 36px;
    }
    .quick-phrases h3 {
      color: #ffd166;
      font-size: 1rem;
      margin-bottom: 14px;
      text-align: center;
    }
    .phrases-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .phrase-chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,209,102,0.3);
      background: rgba(255,209,102,0.06);
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .phrase-chip:hover {
      border-color: #ffd166;
      background: rgba(255,209,102,0.12);
      color: #ffd166;
    }

    .error-msg {
      color: #ff9999;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }
    .error-msg.show { display: block; }

    @media (max-width: 600px) {
      .translator-box {
        grid-template-columns: 1fr;
      }
      .translator-title-box h1 { font-size: 1.6rem; }
      .translate-btn-main { padding: 13px 30px; }
    }
  </style>
</head>
<body class="stories-body">

  <div class="stories-bg" id="translatorBg"></div>

  <div id="loader">
    <div class="loader-content">
      <img src="images/logo.png" class="loader-logo" alt="Sannivesham Logo">
      <h1>సన్నివేశం</h1>
      <div class="loader-line"></div>
    </div>
  </div>

  <nav class="glass-navbar">
    <a href="index.html">← వెనుకకు</a>
    <a href="index.html">ప్రారంభం</a>
    <a href="translator.html">అనువాదం</a>
  </nav>

  <div class="translator-page">

    <div class="translator-title-box">
      <h1>🌐 అనువాదం</h1>
      <p>తెలుగు ↔ ఇంగ్లీష్ అనువాదం చేయండి</p>
    </div>

    <!-- LANGUAGE TOGGLE -->
    <div class="lang-toggle-row">
      <span class="lang-label" id="fromLabel">తెలుగు</span>
      <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
      <span class="lang-label" id="toLabel">English</span>
    </div>

    <!-- MAIN BOXES -->
    <div class="translator-box">

      <div class="translator-panel">
        <div class="translator-panel-header">
          <span id="inputLangLabel">తెలుగు</span>
          <button class="clear-btn" id="clearBtn" title="Clear">✕</button>
        </div>
        <textarea
          class="translator-textarea"
          id="inputText"
          placeholder="ఇక్కడ టైప్ చేయండి..."
          maxlength="5000"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span> / 5000</div>
      </div>

      <div class="translator-panel">
        <div class="translator-panel-header">
          <span id="outputLangLabel">English</span>
          <button class="clear-btn" id="copyOutputBtn" title="Copy">⎘</button>
        </div>
        <div class="loading-dots" id="loadingDots">
          <span></span><span></span><span></span>
        </div>
        <div class="output-text" id="outputText">
          <span class="output-placeholder">అనువాదం ఇక్కడ కనిపిస్తుంది...</span>
        </div>
      </div>

    </div>

    <!-- ACTION BUTTONS -->
    <div class="translate-action-row">
      <button class="translate-btn-main" id="translateBtn">అనువదించండి</button>
      <button class="copy-btn" id="copyBtn">📋 కాపీ చేయండి</button>
    </div>
    <p class="error-msg" id="errorMsg">అనువాదం విఫలమైంది. మళ్ళీ ప్రయత్నించండి.</p>

    <!-- QUICK PHRASES -->
    <div class="quick-phrases">
      <h3>త్వరిత వాక్యాలు</h3>
      <div class="phrases-grid" id="phrasesGrid"></div>
    </div>

  </div>

  <footer class="simple-footer">
    <p class="footer-quote">✨ భాష మన గుర్తింపు • అనువాదం మన వారధి ✨</p>
    <script type="module" src="social-links.js"></script>
    <p>© 2026 సన్నివేశం</p>
  </footer>

  <script src="script.js"></script>
  <audio id="bgMusic" loop><source src="music/traditional.mp3" type="audio/mpeg"></audio>
  <button id="musicBtn" class="music-btn">🔊</button>
  <script src="music.js"></script>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // Background
    async function loadBg() {
      try {
        const snap = await getDoc(doc(db, "settings", "backgrounds"));
        if (!snap.exists()) return;
        const data = snap.data();
        const bg = document.getElementById("translatorBg");
        if (!bg) return;
        const url = window.innerWidth <= 700
          ? (data.translatorMobile || data.storiesMobile || "")
          : (data.translatorPc || data.storiesPc || "");
        if (url) bg.style.backgroundImage =
          `linear-gradient(rgba(10,5,0,0.65),rgba(10,5,0,0.70)),url("${url}")`;
      } catch(e) {}
    }
    loadBg();
  </script>

  <script>
    // ─── STATE ───────────────────────────────────────
    let fromLang = "te"; // te = Telugu, en = English
    let toLang   = "en";

    const quickPhrases = {
      te: [
        "నమస్కారం", "ధన్యవాదాలు", "ఎలా ఉన్నారు?",
        "శుభోదయం", "శుభ రాత్రి", "దేవుడు మీకు సహాయం చేయాలి",
        "జయ శ్రీ రామ్", "ఓం నమః శివాయ", "హరే కృష్ణ"
      ],
      en: [
        "Hello", "Thank you", "How are you?",
        "Good morning", "Good night", "God bless you",
        "Jai Shri Ram", "Om Namah Shivaya", "Hare Krishna"
      ]
    };

    // ─── ELEMENTS ────────────────────────────────────
    const inputText     = document.getElementById("inputText");
    const outputText    = document.getElementById("outputText");
    const translateBtn  = document.getElementById("translateBtn");
    const clearBtn      = document.getElementById("clearBtn");
    const copyBtn       = document.getElementById("copyBtn");
    const copyOutputBtn = document.getElementById("copyOutputBtn");
    const swapBtn       = document.getElementById("swapBtn");
    const loadingDots   = document.getElementById("loadingDots");
    const charCount     = document.getElementById("charCount");
    const errorMsg      = document.getElementById("errorMsg");
    const phrasesGrid   = document.getElementById("phrasesGrid");

    // ─── CHAR COUNT ──────────────────────────────────
    inputText.addEventListener("input", () => {
      charCount.innerText = inputText.value.length;
    });

    // ─── RENDER LABELS ───────────────────────────────
    function updateLabels() {
      const names = { te: "తెలుగు", en: "English" };
      document.getElementById("fromLabel").innerText      = names[fromLang];
      document.getElementById("toLabel").innerText        = names[toLang];
      document.getElementById("inputLangLabel").innerText = names[fromLang];
      document.getElementById("outputLangLabel").innerText = names[toLang];
      inputText.placeholder = fromLang === "te"
        ? "ఇక్కడ టైప్ చేయండి..."
        : "Type here...";
      renderPhrases();
    }

    // ─── SWAP ────────────────────────────────────────
    swapBtn.addEventListener("click", () => {
      [fromLang, toLang] = [toLang, fromLang];
      const currentOutput = outputText.innerText;
      if (currentOutput && !outputText.querySelector(".output-placeholder")) {
        inputText.value = currentOutput;
        charCount.innerText = inputText.value.length;
      }
      outputText.innerHTML = `<span class="output-placeholder">${fromLang === "te" ? "అనువాదం ఇక్కడ కనిపిస్తుంది..." : "Translation appears here..."}</span>`;
      updateLabels();
    });

    // ─── CLEAR ───────────────────────────────────────
    clearBtn.addEventListener("click", () => {
      inputText.value = "";
      charCount.innerText = "0";
      outputText.innerHTML = `<span class="output-placeholder">${fromLang === "te" ? "అనువాదం ఇక్కడ కనిపిస్తుంది..." : "Translation appears here..."}</span>`;
      errorMsg.classList.remove("show");
    });

    // ─── COPY ────────────────────────────────────────
    async function copyText(text) {
      if (!text || text.trim() === "") return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = copyBtn;
        btn.innerText = "✅ Copied!";
        setTimeout(() => btn.innerText = "📋 కాపీ చేయండి", 2000);
      } catch(e) {}
    }

    copyBtn.addEventListener("click", () => {
      const text = outputText.innerText;
      if (!outputText.querySelector(".output-placeholder")) copyText(text);
    });

    copyOutputBtn.addEventListener("click", () => {
      const text = outputText.innerText;
      if (!outputText.querySelector(".output-placeholder")) copyText(text);
    });

    // ─── TRANSLATE ───────────────────────────────────
    async function translate() {
      const text = inputText.value.trim();
      if (!text) return;

      translateBtn.disabled = true;
      loadingDots.classList.add("show");
      outputText.innerHTML = "";
      errorMsg.classList.remove("show");

      try {
        // Use Google Translate API (free tier via unofficial endpoint)
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();

        let result = "";
        if (data && data[0]) {
          data[0].forEach(part => {
            if (part[0]) result += part[0];
          });
        }

        if (result) {
          outputText.innerText = result;
        } else {
          throw new Error("Empty response");
        }
      } catch(e) {
        errorMsg.classList.add("show");
        outputText.innerHTML = `<span class="output-placeholder">${fromLang === "te" ? "అనువాదం ఇక్కడ కనిపిస్తుంది..." : "Translation appears here..."}</span>`;
      } finally {
        loadingDots.classList.remove("show");
        translateBtn.disabled = false;
      }
    }

    translateBtn.addEventListener("click", translate);

    // Translate on Ctrl+Enter
    inputText.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key === "Enter") translate();
    });

    // ─── QUICK PHRASES ───────────────────────────────
    function renderPhrases() {
      phrasesGrid.innerHTML = "";
      const phrases = quickPhrases[fromLang] || quickPhrases.te;
      phrases.forEach(phrase => {
        const chip = document.createElement("button");
        chip.className = "phrase-chip";
        chip.innerText = phrase;
        chip.addEventListener("click", () => {
          inputText.value = phrase;
          charCount.innerText = phrase.length;
          translate();
        });
        phrasesGrid.appendChild(chip);
      });
    }

    // ─── INIT ────────────────────────────────────────
    updateLabels();
  </script>

</body>
</html>
